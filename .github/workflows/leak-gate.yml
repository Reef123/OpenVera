name: leak-gate
on: [push]
permissions:
  contents: read
jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leak gate scan (fails closed on matcher self-test)
        env:
          VERA_DENYLIST_TERMS: ${{ secrets.VERA_DENYLIST_TERMS }}
        run: python3 .github/leak-gate/scan.py "${{ github.event.before }}" "${{ github.sha }}"
