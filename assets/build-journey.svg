<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 1200 675">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8B5A3C"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FBF8F2"/>

  <text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#3A2418">Two ways to build</text>

  <!-- V0 lane -->
  <text x="60" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="bold" fill="#3A2418">/build new</text>
  <text x="196" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#3A2418" opacity="0.65">one session, ~10 to 20 minutes</text>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3A2418" text-anchor="middle">
    <rect x="60" y="172" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="126" y="206">idea</text>
    <rect x="218" y="172" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="284" y="199">2-4</text>
    <text x="284" y="219">questions</text>
    <rect x="376" y="172" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="442" y="206">scout</text>
    <rect x="534" y="172" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="600" y="199">scope</text>
    <text x="600" y="219">guard</text>
    <rect x="692" y="172" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="758" y="199">build</text>
    <text x="758" y="219">loop</text>
    <rect x="850" y="172" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="916" y="199">browser</text>
    <text x="916" y="219">check</text>
    <rect x="1008" y="172" width="132" height="56" rx="11" fill="#C89B3C" stroke="#3A2418" stroke-width="2"/>
    <text x="1074" y="199">&#128024; V0</text>
    <text x="1074" y="219">shipped</text>
  </g>
  <g stroke="#8B5A3C" stroke-width="2.5" fill="none">
    <line x1="194" y1="200" x2="214" y2="200" marker-end="url(#arr)"/>
    <line x1="352" y1="200" x2="372" y2="200" marker-end="url(#arr)"/>
    <line x1="510" y1="200" x2="530" y2="200" marker-end="url(#arr)"/>
    <line x1="668" y1="200" x2="688" y2="200" marker-end="url(#arr)"/>
    <line x1="826" y1="200" x2="846" y2="200" marker-end="url(#arr)"/>
    <line x1="984" y1="200" x2="1004" y2="200" marker-end="url(#arr)"/>
  </g>
  <text x="60" y="266" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#3A2418" opacity="0.65">stop any time: the state file persists, /build continue picks up exactly where you left off</text>

  <!-- connector -->
  <line x1="1074" y1="232" x2="1074" y2="330" stroke="#8B5A3C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <text x="1052" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#8B5A3C" text-anchor="end">worth investing in? you'll know</text>

  <!-- V1 lane -->
  <text x="60" y="372" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="bold" fill="#3A2418">/build full</text>
  <text x="186" y="372" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#3A2418" opacity="0.65">multiple sessions, context handed through files</text>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3A2418" text-anchor="middle">
    <rect x="60" y="394" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="126" y="428">PRD</text>
    <rect x="218" y="394" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="284" y="421">tech</text>
    <text x="284" y="441">spec</text>
    <rect x="376" y="394" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="442" y="421">arch</text>
    <text x="442" y="441">review</text>
    <rect x="534" y="394" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="600" y="421">phased</text>
    <text x="600" y="441">builds + tests</text>
    <rect x="692" y="394" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="758" y="421">code</text>
    <text x="758" y="441">review</text>
    <rect x="850" y="394" width="132" height="56" rx="11" fill="#FFFDF7" stroke="#3A2418" stroke-width="2"/>
    <text x="916" y="428">QA</text>
    <rect x="1008" y="394" width="132" height="56" rx="11" fill="#8B5A3C" stroke="#3A2418" stroke-width="2"/>
    <text x="1074" y="428" fill="#FBF8F2">V1</text>
  </g>
  <g stroke="#8B5A3C" stroke-width="2.5" fill="none">
    <line x1="194" y1="422" x2="214" y2="422" marker-end="url(#arr)"/>
    <line x1="352" y1="422" x2="372" y2="422" marker-end="url(#arr)"/>
    <line x1="510" y1="422" x2="530" y2="422" marker-end="url(#arr)"/>
    <line x1="668" y1="422" x2="688" y2="422" marker-end="url(#arr)"/>
    <line x1="826" y1="422" x2="846" y2="422" marker-end="url(#arr)"/>
    <line x1="984" y1="422" x2="1004" y2="422" marker-end="url(#arr)"/>
  </g>

  <!-- footer -->
  <rect x="60" y="520" width="1080" height="74" rx="12" fill="#FFFDF7" stroke="#C89B3C" stroke-width="2.5"/>
  <text x="600" y="551" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" fill="#3A2418" text-anchor="middle">Don't start with /build full. Start with V0.</text>
  <text x="600" y="579" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#3A2418" opacity="0.7" text-anchor="middle">A finished V0 that solves one problem beats a spec for V3 that never gets built.</text>
</svg>
