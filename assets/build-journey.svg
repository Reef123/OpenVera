<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="860" height="520" rx="16" fill="#1a120b"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" fill="#FFF5E1" font-size="14" font-weight="600" letter-spacing="1">FROM IDEA TO PRODUCT — TWO PATHS</text>

  <!-- V0 Section -->
  <rect x="30" y="56" width="800" height="200" rx="12" fill="#2F241D" stroke="#FFC425" stroke-width="1.5"/>
  <rect x="30" y="56" width="800" height="34" rx="12" fill="#6B4C1E"/>
  <rect x="30" y="78" width="800" height="12" fill="#6B4C1E"/>
  <text x="60" y="80" fill="#FFF5E1" font-size="13" font-weight="700">V0 — VIBE CODE IT</text>
  <text x="540" y="80" fill="#FFC425" font-size="11">One session. One problem. Ship something real.</text>

  <!-- V0 flow -->
  <g transform="translate(50, 105)">
    <rect width="120" height="56" rx="8" fill="#241C14" stroke="#FFC425" stroke-width="1.2"/>
    <text x="60" y="24" text-anchor="middle" fill="#FFC425" font-size="11" font-weight="700">/start-here</text>
    <text x="60" y="42" text-anchor="middle" fill="#C4A882" font-size="10">"I have an idea..."</text>
  </g>
  <path d="M 175 133 L 195 133" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(200, 105)">
    <rect width="120" height="56" rx="8" fill="#241C14" stroke="#EF6224" stroke-width="1.2"/>
    <text x="60" y="24" text-anchor="middle" fill="#EF6224" font-size="11" font-weight="700">/scout</text>
    <text x="60" y="42" text-anchor="middle" fill="#C4A882" font-size="10">quick research</text>
  </g>
  <path d="M 325 133 L 345 133" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(350, 105)">
    <rect width="120" height="56" rx="8" fill="#241C14" stroke="#D4871C" stroke-width="1.2"/>
    <text x="60" y="24" text-anchor="middle" fill="#D4871C" font-size="11" font-weight="700">scope guard</text>
    <text x="60" y="42" text-anchor="middle" fill="#C4A882" font-size="10">1-2 problems only</text>
  </g>
  <path d="M 475 133 L 495 133" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(500, 105)">
    <rect width="120" height="56" rx="8" fill="#241C14" stroke="#B8860B" stroke-width="1.2"/>
    <text x="60" y="24" text-anchor="middle" fill="#FFC425" font-size="11" font-weight="700">/frame</text>
    <text x="60" y="42" text-anchor="middle" fill="#C4A882" font-size="10">tokens + layout</text>
  </g>
  <path d="M 625 133 L 645 133" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(650, 105)">
    <rect width="160" height="56" rx="8" fill="#241C14" stroke="#FFC425" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" fill="#FFC425" font-size="11" font-weight="700">build + ship</text>
    <text x="80" y="42" text-anchor="middle" fill="#C4A882" font-size="10">working in browser</text>
  </g>

  <!-- V0 callout -->
  <rect x="50" y="180" width="760" height="36" rx="6" fill="#241C14" stroke="#EF6224" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="430" y="203" text-anchor="middle" fill="#EF6224" font-size="12">One user stop (Purpose Check) then autonomous to browser. /build new fires this whole path.</text>

  <!-- Arrow between V0 and V1+ -->
  <text x="430" y="282" text-anchor="middle" fill="#8B7355" font-size="12">V0 works? Now make it real.</text>
  <path d="M 430 290 L 430 310" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <!-- V1+ Section -->
  <rect x="30" y="316" width="800" height="180" rx="12" fill="#2F241D" stroke="#EF6224" stroke-width="1.5"/>
  <rect x="30" y="316" width="800" height="34" rx="12" fill="#5C3310"/>
  <rect x="30" y="338" width="800" height="12" fill="#5C3310"/>
  <text x="60" y="340" fill="#FFF5E1" font-size="13" font-weight="700">V1+ — FULL SDLC</text>
  <text x="540" y="340" fill="#EF6224" font-size="11">Multi-session. Production-grade. /build full fires this path.</text>

  <!-- V1+ flow -->
  <g transform="translate(50, 365)">
    <rect width="100" height="56" rx="8" fill="#241C14" stroke="#EF6224" stroke-width="1.2"/>
    <text x="50" y="24" text-anchor="middle" fill="#EF6224" font-size="11" font-weight="700">/research</text>
    <text x="50" y="42" text-anchor="middle" fill="#C4A882" font-size="10">deep dive</text>
  </g>
  <path d="M 155 393 L 170 393" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(175, 365)">
    <rect width="100" height="56" rx="8" fill="#241C14" stroke="#D4871C" stroke-width="1.2"/>
    <text x="50" y="24" text-anchor="middle" fill="#D4871C" font-size="11" font-weight="700">/steer</text>
    <text x="50" y="42" text-anchor="middle" fill="#C4A882" font-size="10">gap analysis</text>
  </g>
  <path d="M 280 393 L 295 393" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(300, 365)">
    <rect width="100" height="56" rx="8" fill="#241C14" stroke="#B8860B" stroke-width="1.2"/>
    <text x="50" y="24" text-anchor="middle" fill="#FFC425" font-size="11" font-weight="700">PRD</text>
    <text x="50" y="42" text-anchor="middle" fill="#C4A882" font-size="10">requirements</text>
  </g>
  <path d="M 405 393 L 420 393" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(425, 365)">
    <rect width="100" height="56" rx="8" fill="#241C14" stroke="#8B6914" stroke-width="1.2"/>
    <text x="50" y="24" text-anchor="middle" fill="#C4A882" font-size="11" font-weight="700">tech spec</text>
    <text x="50" y="42" text-anchor="middle" fill="#8B7355" font-size="10">architecture</text>
  </g>
  <path d="M 530 393 L 545 393" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(550, 365)">
    <rect width="100" height="56" rx="8" fill="#241C14" stroke="#6B4C1E" stroke-width="1.2"/>
    <text x="50" y="24" text-anchor="middle" fill="#C4A882" font-size="11" font-weight="700">build</text>
    <text x="50" y="42" text-anchor="middle" fill="#8B7355" font-size="10">phased</text>
  </g>
  <path d="M 655 393 L 670 393" stroke="#6B4C1E" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>

  <g transform="translate(675, 365)">
    <rect width="140" height="56" rx="8" fill="#241C14" stroke="#FFC425" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" fill="#FFC425" font-size="11" font-weight="700">QA + ship</text>
    <text x="70" y="42" text-anchor="middle" fill="#C4A882" font-size="10">code review, tests</text>
  </g>

  <!-- V1+ callout -->
  <rect x="50" y="440" width="760" height="36" rx="6" fill="#241C14" stroke="#4B3621" stroke-width="0.5"/>
  <text x="430" y="463" text-anchor="middle" fill="#C4A882" font-size="12">Multiple sessions. File-based handoff. /build full orchestrates the entire SDLC pipeline.</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#6B4C1E" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
