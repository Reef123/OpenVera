<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FBF8F2"/>

  <text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#3A2418">Skills: three layers over shared state</text>

  <!-- ENTRY POINTS -->
  <text x="60" y="116" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C89B3C" letter-spacing="3">ENTRY POINTS</text>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <rect x="60" y="130" width="330" height="74" rx="12" fill="#FFFDF7" stroke="#3A2418" stroke-width="2.5"/>
    <text x="225" y="162" font-size="22" font-weight="bold" fill="#3A2418" text-anchor="middle">/start-vague</text>
    <text x="225" y="190" font-size="16" fill="#3A2418" opacity="0.7" text-anchor="middle">shape a half-formed idea</text>
    <rect x="435" y="130" width="330" height="74" rx="12" fill="#FFFDF7" stroke="#3A2418" stroke-width="2.5"/>
    <text x="600" y="162" font-size="22" font-weight="bold" fill="#3A2418" text-anchor="middle">/build new</text>
    <text x="600" y="190" font-size="16" fill="#3A2418" opacity="0.7" text-anchor="middle">idea to working V0</text>
    <rect x="810" y="130" width="330" height="74" rx="12" fill="#FFFDF7" stroke="#3A2418" stroke-width="2.5"/>
    <text x="975" y="162" font-size="22" font-weight="bold" fill="#3A2418" text-anchor="middle">/build full</text>
    <text x="975" y="190" font-size="16" fill="#3A2418" opacity="0.7" text-anchor="middle">V1+ full SDLC</text>
  </g>

  <!-- BUILDING BLOCKS -->
  <text x="60" y="248" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B5A3C" letter-spacing="3">BUILDING BLOCKS</text>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="bold" fill="#3A2418" text-anchor="middle">
    <rect x="60" y="262" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="187" y="297">/scout</text>
    <rect x="335" y="262" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="462" y="297">/research</text>
    <rect x="610" y="262" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="737" y="297">/consult</text>
    <rect x="885" y="262" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="1012" y="297">/frame</text>
    <rect x="60" y="330" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="187" y="365">/wireframe-first</text>
    <rect x="335" y="330" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="462" y="365">/panel</text>
    <rect x="610" y="330" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="737" y="365">/advisor</text>
    <rect x="885" y="330" width="255" height="56" rx="12" fill="#FFFDF7" stroke="#8B5A3C" stroke-width="2"/>
    <text x="1012" y="365">/code-review</text>
  </g>
  <text x="600" y="416" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#3A2418" opacity="0.65" text-anchor="middle">research, design, and pushback: entry points call these as needed</text>

  <!-- META -->
  <text x="60" y="462" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3A2418" letter-spacing="3" opacity="0.8">META: THE LOOP</text>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <rect x="60" y="476" width="330" height="74" rx="12" fill="#FFFDF7" stroke="#C89B3C" stroke-width="2.5"/>
    <text x="225" y="508" font-size="22" font-weight="bold" fill="#3A2418" text-anchor="middle">/improve</text>
    <text x="225" y="536" font-size="16" fill="#3A2418" opacity="0.7" text-anchor="middle">rewrites underperforming skills</text>
    <rect x="435" y="476" width="330" height="74" rx="12" fill="#FFFDF7" stroke="#C89B3C" stroke-width="2.5"/>
    <text x="600" y="508" font-size="22" font-weight="bold" fill="#3A2418" text-anchor="middle">/curate</text>
    <text x="600" y="536" font-size="16" fill="#3A2418" opacity="0.7" text-anchor="middle">prunes memory, verifies promotions</text>
    <rect x="810" y="476" width="330" height="74" rx="12" fill="#FFFDF7" stroke="#C89B3C" stroke-width="2.5"/>
    <text x="975" y="508" font-size="22" font-weight="bold" fill="#3A2418" text-anchor="middle">/doc-sync</text>
    <text x="975" y="536" font-size="16" fill="#3A2418" opacity="0.7" text-anchor="middle">writes state + lessons back</text>
  </g>

  <!-- SUBSTRATE -->
  <rect x="60" y="580" width="1080" height="64" rx="12" fill="#3A2418"/>
  <text x="600" y="620" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FBF8F2" text-anchor="middle">shared state on disk: cockpit &#183; state.md &#183; inbox &#183; memory &#183; build state &#183; telemetry</text>
</svg>
