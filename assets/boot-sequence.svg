<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FBF8F2"/>

  <text x="60" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#3A2418">Boot sequence: three tiers of context</text>
  <text x="60" y="112" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#3A2418" opacity="0.7">When Claude opens the workspace, only what's needed loads. The rest waits on disk.</text>

  <!-- CORE -->
  <rect x="60" y="150" width="1080" height="140" rx="14" fill="#FFFDF7" stroke="#3A2418" stroke-width="2.5"/>
  <rect x="60" y="150" width="14" height="140" rx="7" fill="#C89B3C"/>
  <text x="100" y="206" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#3A2418" letter-spacing="2">CORE</text>
  <text x="100" y="244" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#3A2418" opacity="0.8">state.md &#183; patterns.md &#183; boot rules &#183; about 300 lines total</text>
  <rect x="868" y="195" width="232" height="44" rx="22" fill="#C89B3C"/>
  <text x="984" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" fill="#3A2418" text-anchor="middle">loads every session</text>

  <!-- RECALL -->
  <rect x="60" y="320" width="1080" height="140" rx="14" fill="#FFFDF7" stroke="#3A2418" stroke-width="2.5"/>
  <rect x="60" y="320" width="14" height="140" rx="7" fill="#8B5A3C"/>
  <text x="100" y="376" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#3A2418" letter-spacing="2">RECALL</text>
  <text x="100" y="414" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#3A2418" opacity="0.8">ROADMAP.md &#183; voice + identity &#183; recent session logs &#183; memory index</text>
  <rect x="868" y="365" width="232" height="44" rx="22" fill="#8B5A3C"/>
  <text x="984" y="394" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FBF8F2" text-anchor="middle">loads on demand</text>

  <!-- ARCHIVAL -->
  <rect x="60" y="490" width="1080" height="140" rx="14" fill="#FFFDF7" stroke="#3A2418" stroke-width="2.5" stroke-dasharray="9 7"/>
  <rect x="60" y="490" width="14" height="140" rx="7" fill="#3A2418" opacity="0.35"/>
  <text x="100" y="546" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#3A2418" letter-spacing="2">ARCHIVAL</text>
  <text x="100" y="584" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" fill="#3A2418" opacity="0.8">old conversation logs &#183; research papers &#183; finished project notes</text>
  <rect x="868" y="535" width="232" height="44" rx="22" fill="none" stroke="#3A2418" stroke-width="2"/>
  <text x="984" y="564" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" fill="#3A2418" text-anchor="middle">search only</text>
</svg>
