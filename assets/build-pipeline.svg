<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="860" height="320" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" letter-spacing="1">/build new — IDEA TO WORKING APP</text>

  <!-- Step 1: Start -->
  <rect x="30" y="65" width="130" height="70" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="96" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">/start-here</text>
  <text x="95" y="116" text-anchor="middle" fill="#94a3b8" font-size="10">spark → concept</text>

  <!-- Arrow -->
  <path d="M 165 100 L 185 100" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 2: Research -->
  <rect x="190" y="65" width="130" height="70" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="255" y="96" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">/scout</text>
  <text x="255" y="116" text-anchor="middle" fill="#94a3b8" font-size="10">quick research</text>

  <!-- Arrow -->
  <path d="M 325 100 L 345 100" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 3: Scope -->
  <rect x="350" y="65" width="130" height="70" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="415" y="96" text-anchor="middle" fill="#6366f1" font-size="12" font-weight="700">scope guard</text>
  <text x="415" y="116" text-anchor="middle" fill="#94a3b8" font-size="10">1-2 problems max</text>

  <!-- Arrow -->
  <path d="M 485 100 L 505 100" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 4: Design -->
  <rect x="510" y="65" width="130" height="70" rx="10" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="575" y="96" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">/frame</text>
  <text x="575" y="116" text-anchor="middle" fill="#94a3b8" font-size="10">tokens + wireframes</text>

  <!-- Arrow -->
  <path d="M 645 100 L 665 100" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Step 5: Build -->
  <rect x="670" y="65" width="160" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="750" y="96" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">build loop</text>
  <text x="750" y="116" text-anchor="middle" fill="#94a3b8" font-size="10">code → test → iterate</text>

  <!-- User gate callout -->
  <rect x="270" y="170" width="320" height="60" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="430" y="196" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">One user stop: Purpose Check</text>
  <text x="430" y="214" text-anchor="middle" fill="#94a3b8" font-size="11">What's the job? What pain? What happens in 30 seconds?</text>

  <!-- Dotted line from gate to flow -->
  <line x1="430" y1="170" x2="430" y2="140" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Bottom: autonomous zone -->
  <rect x="30" y="260" width="800" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="430" y="285" text-anchor="middle" fill="#64748b" font-size="12">After the purpose check, everything runs autonomously → you see a working app in the browser.</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
