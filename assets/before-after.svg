<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="860" height="340" rx="16" fill="#1a120b"/>

  <!-- Left: Without -->
  <rect x="30" y="20" width="390" height="300" rx="12" fill="#2F241D" stroke="#4B3621" stroke-width="1"/>
  <text x="225" y="56" text-anchor="middle" fill="#8B7355" font-size="13" font-weight="600" letter-spacing="1.5">WITHOUT A HARNESS</text>

  <g transform="translate(60, 80)">
    <rect width="330" height="44" rx="8" fill="#241C14" stroke="#EF6224" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="22" r="6" fill="#EF6224" opacity="0.6"/>
    <text x="42" y="26" fill="#FFF5E1" font-size="13">Session 1 — cold start, no context</text>
  </g>
  <g transform="translate(60, 136)">
    <rect width="330" height="44" rx="8" fill="#241C14" stroke="#EF6224" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="22" r="6" fill="#EF6224" opacity="0.6"/>
    <text x="42" y="26" fill="#FFF5E1" font-size="13">Session 10 — cold start, no context</text>
  </g>
  <g transform="translate(60, 192)">
    <rect width="330" height="44" rx="8" fill="#241C14" stroke="#EF6224" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="22" r="6" fill="#EF6224" opacity="0.6"/>
    <text x="42" y="26" fill="#FFF5E1" font-size="13">Session 50 — cold start, no context</text>
  </g>
  <text x="225" y="272" text-anchor="middle" fill="#8B7355" font-size="12" font-style="italic">Every session starts from zero.</text>

  <!-- Divider -->
  <line x1="430" y1="40" x2="430" y2="300" stroke="#4B3621" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right: With Vera -->
  <rect x="440" y="20" width="390" height="300" rx="12" fill="#2F241D" stroke="#4B3621" stroke-width="1"/>
  <text x="635" y="56" text-anchor="middle" fill="#FFC425" font-size="13" font-weight="600" letter-spacing="1.5">WITH VERA</text>

  <g transform="translate(470, 80)">
    <rect width="330" height="44" rx="8" fill="#241C14" stroke="#FFC425" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="22" cy="22" r="6" fill="#FFC425" opacity="0.5"/>
    <text x="42" y="26" fill="#FFF5E1" font-size="13">Session 1 — patterns + identity loaded</text>
  </g>
  <g transform="translate(470, 136)">
    <rect width="330" height="44" rx="8" fill="#241C14" stroke="#FFC425" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="22" cy="22" r="6" fill="#FFC425" opacity="0.65"/>
    <text x="42" y="26" fill="#FFF5E1" font-size="13">Session 10 — knows your preferences</text>
  </g>
  <g transform="translate(470, 192)">
    <rect width="330" height="44" rx="8" fill="#241C14" stroke="#FFC425" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="22" cy="22" r="6" fill="#FFC425" opacity="0.85"/>
    <text x="42" y="26" fill="#FFF5E1" font-size="13">Session 50 — anticipates failure modes</text>
  </g>
  <text x="635" y="272" text-anchor="middle" fill="#FFC425" font-size="12" font-style="italic">Every session builds on the last.</text>
</svg>
